<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Feedback Portal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <i class="fas fa-comment-dots"></i>
            </div>
            <h1>Student Feedback Portal</h1>
            <p class="subtitle">We value your feedback to improve our teaching quality</p>
        </header>

        <main class="feedback-card">
            <form id="feedbackForm" class="feedback-form">
                <div class="form-group">
                    <label for="studentName">
                        <i class="fas fa-user"></i> Student Name
                    </label>
                    <input type="text" id="studentName" name="studentName" placeholder="Enter your full name" required>
                    <span class="error-message" id="nameError"></span>
                </div>

                <div class="form-group">
                    <label for="studentEmail">
                        <i class="fas fa-envelope"></i> Email Address
                    </label>
                    <input type="email" id="studentEmail" name="studentEmail" placeholder="Enter your email" required>
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="course">
                        <i class="fas fa-book"></i> Course/Subject
                    </label>
                    <select id="course" name="course" required>
                        <option value="" disabled selected>Select your course</option>
                        <option value="computer-fundamentals">Computer Fundamentals</option>
                        <option value="web-development">Web Development (AWT)</option>
                        <option value="data-structures">Data Structures</option>
                        <option value="database-management">Database Management</option>
                        <option value="computer-networks">Computer Networks</option>
                        <option value="software-engineering">Software Engineering</option>
                        <option value="mathematics">Mathematics</option>
                        <option value="english">English Communication</option>
                        <option value="other">Other</option>
                    </select>
                    <input type="text" id="otherCourse" name="otherCourse" placeholder="Please specify your course"
                        style="display: none;">
                    <span class="error-message" id="courseError"></span>
                </div>

                <div class="form-group">
                    <label>
                        <i class="fas fa-star"></i> Rating
                    </label>
                    <div class="rating-container">
                        <div class="star-rating" id="starRating">
                            <i class="far fa-star" data-rating="1"></i>
                            <i class="far fa-star" data-rating="2"></i>
                            <i class="far fa-star" data-rating="3"></i>
                            <i class="far fa-star" data-rating="4"></i>
                            <i class="far fa-star" data-rating="5"></i>
                        </div>
                        <input type="hidden" id="rating" name="rating" value="0">
                        <span class="rating-text" id="ratingText">Click to rate</span>
                    </div>
                    <span class="error-message" id="ratingError"></span>
                </div>

                <div class="form-group">
                    <label for="comments">
                        <i class="fas fa-pencil-alt"></i> Feedback Comments
                    </label>
                    <textarea id="comments" name="comments"
                        placeholder="Share your thoughts about the course, teaching quality, and suggestions for improvement..."
                        rows="5" required></textarea>
                    <span class="char-count"><span id="charCount">0</span>/500 characters</span>
                    <span class="error-message" id="commentsError"></span>
                </div>

                <button type="submit" class="submit-btn">
                    <i class="fas fa-paper-plane"></i> Submit Feedback
                </button>
            </form>

            <div class="success-message" id="successMessage">
                <div class="success-icon">
                    <i class="fas fa-check-circle"></i>
                </div>
                <h2>Thank You!</h2>
                <p>Your feedback has been submitted successfully . </p>
                <button class="reset-btn" id="resetBtn">
                    <i class="fas fa-redo"></i> Submit Another Feedback
                </button>
            </div>
        </main>

        <footer class="footer">
            <p>&copy; 2024 Student Feedback Portal. All rights reserved.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>

</html>
