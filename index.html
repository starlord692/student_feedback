<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback Portal - STUDΞNT</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="centered">
<div class="feedback-container">

<header>
<div class="logo">
<i class="fas fa-meteor"></i>
</div>
<h1>Feedback Portal</h1>
<p class="subtitle">Submit Your Cosmos-Level Feedback Here</p>
</header>

<main class="feedback-card">

<form id="feedbackForm" class="feedback-form">

<div class="form-group">
<label for="studentName"><i class="fas fa-user-astronaut"></i> Student Name</label>
<input type="text" id="studentName" name="studentName" placeholder="Enter your full name" required>
<span class="error-message" id="nameError"></span>
</div>

<div class="form-group">
<label for="studentEmail"><i class="fas fa-envelope"></i> Email Address</label>
<input type="email" id="studentEmail" name="studentEmail" placeholder="Enter your email" required>
<span class="error-message" id="emailError"></span>
</div>

<div class="form-group">
<label for="course"><i class="fas fa-book"></i> Course/Subject</label>
<select id="course" name="course" required>
<option value="" disabled selected>Select your course</option>
<option value="computer-fundamentals">Computer Fundamentals</option>
<option value="web-development">Web Development (AWT)</option>
<option value="data-structures">Data Structures</option>
<option value="database-management">Database Management</option>
<option value="computer-networks">Computer Networks</option>
<option value="software-engineering">Software Engineering</option>
<option value="mathematics">Mathematics</option>
<option value="english">English Communication</option>
<option value="other">Other</option>
</select>
<span class="error-message" id="courseError"></span>
</div>

<div class="form-group">
<label><i class="fas fa-star"></i> Component Rating</label>

<div class="rating-container">
<div class="star-rating" id="starRating">
<i class="far fa-star" data-rating="1"></i>
<i class="far fa-star" data-rating="2"></i>
<i class="far fa-star" data-rating="3"></i>
<i class="far fa-star" data-rating="4"></i>
<i class="far fa-star" data-rating="5"></i>
</div>

<input type="hidden" id="rating" name="rating" value="0">
<span class="rating-text" id="ratingText">Click to rate</span>

</div>

<span class="error-message" id="ratingError"></span>
</div>

<div class="form-group">
<label for="comments"><i class="fas fa-pencil-alt"></i> Feedback Comments</label>

<textarea id="comments" name="comments" rows="4" required></textarea>

<span class="char-count"><span id="charCount">0</span>/500</span>

<span class="error-message" id="commentsError"></span>
</div>

<button type="submit" class="submit-btn">
<i class="fas fa-paper-plane"></i> Submit Feedback
</button>

</form>

<div class="success-message" id="successMessage">
<h2>Thank You!</h2>
<p>Your feedback was submitted.</p>
<button class="reset-btn" id="resetBtn">Submit Another</button>
</div>

</main>
</div>

<script>

/* store feedback */
const allFeedbacks=[];

const feedbackForm=document.getElementById("feedbackForm");
const successMessage=document.getElementById("successMessage");
const resetBtn=document.getElementById("resetBtn");

const starRating=document.getElementById("starRating");
const stars=starRating.querySelectorAll("i");
const ratingInput=document.getElementById("rating");

const comments=document.getElementById("comments");
const charCount=document.getElementById("charCount");


/* rating labels */

const ratingLabels=[
"Click to rate",
"Poor",
"Fair",
"Good",
"Very Good",
"Excellent"
];


/* star rating */

stars.forEach(star=>{

star.addEventListener("click",()=>{

let rating=parseInt(star.dataset.rating);

ratingInput.value=rating;

stars.forEach(s=>{
s.classList.remove("fas");
s.classList.add("far");
});

for(let i=0;i<rating;i++){
stars[i].classList.remove("far");
stars[i].classList.add("fas");
}

});

});


/* character counter */

comments.addEventListener("input",()=>{

charCount.textContent=comments.value.length;

if(comments.value.length>500){

comments.value=comments.value.substring(0,500);

charCount.textContent=500;

}

});


/* form validation */

function validateForm(){

if(ratingInput.value==0){

alert("Please rate the course");

return false;

}

return true;

}


/* ===== AJAX ADDED HERE ===== */

function handleSubmit(e){

e.preventDefault();

if(!validateForm()) return;

/* create form data */

const formData=new FormData(feedbackForm);

/* fake ajax request */

fetch("https://jsonplaceholder.typicode.com/posts",{

method:"POST",

body:formData

})

.then(res=>res.json())

.then(data=>{

/* existing logic */

allFeedbacks.push({

name:document.getElementById("studentName").value,

email:document.getElementById("studentEmail").value,

course:document.getElementById("course").value,

rating:ratingInput.value,

comments:comments.value

});

/* show success */

feedbackForm.style.display="none";

successMessage.style.display="block";

})

.catch(err=>console.log(err));

}


/* submit event */

feedbackForm.addEventListener("submit",handleSubmit);


/* reset form */

resetBtn.addEventListener("click",()=>{

feedbackForm.reset();

successMessage.style.display="none";

feedbackForm.style.display="block";

});


</script>
</body>
</html>
